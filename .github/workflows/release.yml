name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: fastPaste v__VERSION__
          releaseBody: "See README"
          releaseDraft: true
          prerelease: false

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # universal-apple-darwin needs BOTH Intel and Apple Silicon std libs;
      # macos-latest runners only preinstall aarch64-apple-darwin.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin
          tagName: v__VERSION__
          releaseName: fastPaste v__VERSION__
          releaseBody: "See README"
          releaseDraft: true
          prerelease: false
