<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>fastPaste</title>
<style>
  :root {
    --shell: #101014;
    --panel: #1e1e24;
    --card: rgba(255, 255, 255, 0.055);
    --card-hover: rgba(255, 255, 255, 0.10);
    --card-active: rgba(107, 124, 255, 0.35);
    --fg: #f2f2f6;
    --fg-dim: #8e8e98;
    --accent: #6b7cff;
    --radius: 22px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--fg);
    background: var(--shell);
    user-select: none;
  }

  /* The panel always fills the window minus a fixed inset - no flex centering,
     no transparent compositing, works on any GPU / window size. */
  #panel {
    position: fixed; inset: 10px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: var(--radius);
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
    display: flex; flex-direction: column;
    overflow: hidden;
    animation: pop .1s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.99); } to { opacity: 1; transform: none; } }

  /* ---------- header ---------- */
  header { padding: 16px 18px 10px; flex: 0 0 auto; }
  #searchwrap {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px; padding: 10px 14px;
  }
  #searchwrap:focus-within { border-color: var(--accent); }
  #search { flex: 1; background: none; border: none; outline: none; color: var(--fg); font-size: 16px; }
  #search::placeholder { color: var(--fg-dim); }
  .kbd-hint { font-size: 11px; color: var(--fg-dim); white-space: nowrap; }

  #tabs { display: flex; gap: 6px; margin-top: 12px; align-items: center; }
  .tab {
    padding: 5px 14px; font-size: 12px; border-radius: 20px; cursor: pointer;
    color: var(--fg-dim); background: rgba(255,255,255,0.05);
    letter-spacing: 0.02em;
  }
  .tab:hover { background: rgba(255,255,255,0.10); }
  .tab.active { background: var(--accent); color: #fff; }
  .tab.ghost { background: none; }

  /* ---------- content: Paste-style time-grouped horizontal card rows ---------- */
  #content { flex: 1; overflow-y: auto; padding: 2px 18px 18px; }
  #content::-webkit-scrollbar { width: 6px; }
  #content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 3px; }
  .group-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    color: var(--fg-dim); margin: 18px 2px 10px; text-transform: uppercase;
  }
  .row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
  .row::-webkit-scrollbar { height: 4px; }
  .row::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

  .card {
    position: relative; flex: 0 0 auto;
    width: 170px; height: 122px;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px; padding: 12px;
    cursor: default; overflow: hidden;
    display: flex; flex-direction: column;
    transition: background .08s, border-color .08s, transform .08s;
  }
  .card:hover { background: var(--card-hover); transform: translateY(-1px); }
  .card.selected { border-color: var(--accent); background: var(--card-active); }
  .card .preview {
    flex: 1; font-size: 12.5px; line-height: 1.5; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical;
    word-break: break-all; white-space: pre-wrap;
  }
  .card img.thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card .meta {
    display: flex; align-items: center; gap: 6px; margin-top: 8px;
    font-size: 10.5px; color: var(--fg-dim);
  }
  .card .badge {
    position: absolute; top: 8px; right: 8px; font-size: 10px;
    background: rgba(0,0,0,0.5); border-radius: 8px; padding: 1px 7px; color: #ffd166;
  }
  .card .stackno {
    position: absolute; top: 8px; left: 8px; width: 18px; height: 18px;
    background: var(--accent); color: #fff; border-radius: 50%;
    font-size: 11px; display: flex; align-items: center; justify-content: center;
  }
  .card .fileicon { font-size: 22px; }
  .card .preview mark, .card mark {
    background: rgba(255, 209, 102, 0.55); color: #1c1c20;
    border-radius: 3px; padding: 0 1px;
  }
  .empty { text-align: center; color: var(--fg-dim); margin-top: 70px; font-size: 14px; }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); padding: 7px 16px; border-radius: 10px;
    font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 99;
  }
  #toast.show { opacity: 1; }

  /* ---------- settings ---------- */
  #settings {
    position: absolute; inset: 10px; background: #23232b; border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.07);
    display: none; flex-direction: column; padding: 20px 24px; overflow-y: auto; z-index: 10;
  }
  #settings::-webkit-scrollbar { width: 6px; }
  #settings::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  #settings.open { display: flex; }
  #settings h2 { font-size: 16px; margin-bottom: 14px; }
  .srow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13px; }
  .srow input[type=text], .srow select {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    color: var(--fg); border-radius: 8px; padding: 5px 10px; width: 240px; outline: none; font-size: 12.5px;
  }
  .srow input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  .chiprow { display: flex; flex-wrap: wrap; gap: 6px; max-width: 480px; }
  .chip { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 2px 8px; font-size: 11px; display: flex; gap: 6px; align-items: center; }
  .chip b { cursor: pointer; color: #ff7b72; }
  .btn { background: rgba(255,255,255,0.1); border: none; color: var(--fg); border-radius: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .btn:hover { background: rgba(255,255,255,0.18); }
  .btn.danger { background: rgba(255,90,90,0.25); }
  #logbox {
    display: none; margin-top: 12px; background: rgba(0,0,0,0.4); border-radius: 8px;
    padding: 10px 12px; font-size: 11px; color: var(--fg-dim); max-height: 180px;
    overflow-y: auto; white-space: pre-wrap; user-select: text;
  }
</style>
</head>
<body>
<div id="panel">
  <header>
    <div id="searchwrap">
      <span style="font-size:15px;color:var(--fg-dim)">🔎</span>
      <input id="search" placeholder="搜索剪贴板历史…" autocomplete="off" />
      <span class="kbd-hint">↑↓ 选择 · ⏎ 粘贴 · ⇧⏎ 纯文本 · esc 关闭</span>
    </div>
    <div id="tabs">
      <div class="tab active" data-f="all">全部</div>
      <div class="tab" data-f="text">文本</div>
      <div class="tab" data-f="link">链接</div>
      <div class="tab" data-f="image">图片</div>
      <div class="tab" data-f="files">文件</div>
      <span style="flex:1"></span>
      <div class="tab ghost" id="settingsbtn">⚙ 设置</div>
    </div>
  </header>
  <div id="content"></div>
  <div id="toast"></div>

  <div id="settings">
    <h2>设置</h2>
    <div class="srow"><span>全局热键（如 Control+Shift+V / Command+Shift+V）</span>
      <span style="display:flex;gap:6px"><input type="text" id="cfg-hotkey" style="width:180px" /><button class="btn" id="cfg-savehotkey">应用</button></span>
    </div>
    <div class="srow"><span>历史保留天数（留空为无限）</span><input type="text" id="cfg-days" /></div>
    <div class="srow"><span>磁盘上限（MB，留空为 2048）</span><input type="text" id="cfg-maxmb" /></div>
    <div class="srow"><span>粘贴后保留面板（连续粘贴）</span><input type="checkbox" id="cfg-keepopen" /></div>
    <div class="srow"><span>暂停记录</span><input type="checkbox" id="cfg-pause" /></div>
    <div class="srow" id="row-aware"><span>感知粘贴模式（macOS，减少后台读取提示）</span><input type="checkbox" id="cfg-aware" /></div>
    <div class="srow"><span>面板布局</span><select id="cfg-layout">
      <option value="overlay">居中覆盖层（类似 Spotlight）</option>
      <option value="compact">右侧紧凑小窗（小粘贴卡片）</option>
    </select></div>
    <div class="srow"><span>本地加密（AES-256-GCM，内容文件加密存储）</span><input type="checkbox" id="cfg-encrypt" /></div>
    <div class="srow"><span>开机自启（登录后静默启动，不弹面板）</span><input type="checkbox" id="cfg-autolaunch" /></div>
    <div class="srow">
      <span>排除应用（不采集这些应用的复制）</span>
      <span style="display:flex;gap:6px"><input type="text" id="cfg-excl" placeholder="应用名或路径" style="width:160px" /><button class="btn" id="cfg-addexcl">添加</button></span>
    </div>
    <div class="srow"><span></span><span class="chiprow" id="excludesettings"></span></div>
    <div class="srow"><span>诊断日志（不含剪贴板内容）</span><button class="btn" id="cfg-logs">查看</button></div>
    <div class="srow"><span>数据</span><span style="display:flex;gap:6px">
      <button class="btn" id="cfg-export">导出备份</button>
      <button class="btn" id="cfg-import">导入备份</button>
      <button class="btn danger" id="cfg-clear">清空全部历史</button>
    </span></div>
    <div class="srow"><span></span><button class="btn" id="cfg-close">返回</button></div>
    <div id="logbox"></div>
  </div>
</div>
<script src="tokenizer.js"></script>
<script src="app.js"></script>
</body>
</html>
