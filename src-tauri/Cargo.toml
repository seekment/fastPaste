[package]
name = "fastpaste"
version = "0.2.0"
description = "fastPaste - small & stable cross-platform clipboard manager (no external DB)"
edition = "2021"

[lib]
name = "fastpaste_lib"
crate-type = ["lib"]

[[bin]]
name = "fastpaste"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
once_cell = "1"
parking_lot = "0.12"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
enigo = "0.2"
image = "0.25"
regex-lite = "0.1"
zip = { version = "1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc-foundation = "0.1"
core-graphics = "0.24"
block = "0.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
optional = true
features = [
  "Foundation",
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
]

[features]
default = []
# OCR backends are opt-in to keep the default binary lean (NFR-P01).
ocr-win = ["dep:windows"]
ocr-mac = []

[dev-dependencies]
tempfile = "3"
